<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity WebGL Player | Silver Night</title>

    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #111;
        color: #fff;
        font-family: Arial, sans-serif;
      }

      /* Center the game and allow the page to have other content */
      .game-shell {
        max-width: 1920px;
        margin: 0 auto;
      }

      /* Responsive frame that preserves 16:9.
         It will display at full available width up to 1920,
         and scale down on mobile so the whole menu is visible. */
      .game-frame {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #231F20;
        overflow: hidden;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #231F20;
      }

      /* Optional: on small screens, prevent “trying to play” and let scrolling work */
      @media (max-width: 768px) {
        #unity-canvas { pointer-events: none; }
      }
    </style>
  </head>

  <body>
    <h1>Silver Night</h1>
    <p>Desktop recommended for gameplay. Mobile supported for preview.</p>

    <div class="game-shell">
      <div class="game-frame">
        <!-- Internal render resolution stays 1920x1080 -->
        <canvas id="unity-canvas" width="1920" height="1080"></canvas>
      </div>
    </div>

    <!-- Add whatever else you want below -->
    <h2>About</h2>
    <p>Put your project write-up, screenshots, links, etc. here.</p>

    <script src="Build/Web html Build.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/Web html Build.data",
        frameworkUrl: "Build/Web html Build.framework.js",
        codeUrl: "Build/Web html Build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Hockeykurt",
        productName: "Silver Night",
        productVersion: "1.0",

        // KEY: keep render at 1920x1080 even though CSS may scale it smaller
        matchWebGLToCanvasSize: false,
        devicePixelRatio: 1
      });
    </script>
  </body>
</html>
